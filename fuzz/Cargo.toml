[package]
name = "egui_dock-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
# The persisted format is what our downstream actually writes: RON, not JSON. Fuzzing the
# format we really store is the whole point of seeding the corpus with real layouts.
ron = "0.12"

[dependencies.egui_dock]
path = ".."
# `testkit` exports the operation vocabulary this target drives the dock with — the same one
# the property tests use. Without it the operations would have to be written down here a
# second time, which is exactly how the two harnesses drifted apart before.
features = ["serde", "testkit"]

[[bin]]
name = "tree_ops"
path = "fuzz_targets/tree_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tree_persist"
path = "fuzz_targets/tree_persist.rs"
test = false
doc = false
bench = false
